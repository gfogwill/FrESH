[SERIAL]
PORT      = /dev/ttyUSB0
BAUDRATE  = 9600
BYTES     = 8

# possible values: NONE, EVEN, ODD
PARITY    = NONE
STOPBITS  = 1

# time to wait for response after sending command
PAUSETIME = 0.05
TIMEOUT   = 2.0


[HW]
HVZero_V=-4
HVSpan_V=12500

ADC_HumIn=10,0,v*100.,%
ADC_TempIn=10,1,v*100-40+273.15,K
ADC_PressIn=10,2,(v*260/5.+800)*100,Pa
ADC_HVIIn=10,3,(3000./10.)*v,uA
ADC_HVVIn=10,4,v*(2000./10.),V
ADC_FlowIn=10,5,((10.0-0.2)/(5.0-1.0))*v-2.45,lpm
ADC_AuxIn=10,6,1.0*v-0.97,lpm


