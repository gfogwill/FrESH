# FrESH machine configuration -- template.
#
# Copy this file to etc/fresh.<hostname>.ini on each PC and adjust it.
# The old name etc/test.ini is still recognised, so existing installs keep
# working without changes.

[SERIAL]
# Serial port of the ADAM module (RTD readout). Only the RE1050 and the
# deprecated RK20 use it.
PORT      = /dev/ttyUSB1
BAUDRATE  = 9600
BYTES     = 8

# possible values: NONE, EVEN, ODD
PARITY    = NONE
STOPBITS  = 1

# time to wait for response after sending command
PAUSETIME = 0.05
TIMEOUT   = 2.0

[CHILLER]
# Chiller attached to this PC. Supported: RE1050, RP1845, RK20 (deprecated).
MODEL     = RE1050

# Serial port of the chiller itself. Leave it out on a machine with a single
# serial device and it is found automatically. SET IT whenever there is more
# than one -- on the RE1050 the ADAM module has its own port, and guessing
# between the two is how you end up with "no reply from the chiller".
# It must not be the same port as [SERIAL] PORT above.
#PORT      = /dev/ttyUSB0
